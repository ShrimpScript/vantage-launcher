[package]
name = "vantage-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "vantage_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
